<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIE 사용 가이드 / 使用指南 / Hướng dẫn</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111c2e; --panel2:#0b1220; --bd:#1e293b;
    --tx:#e2e8f0; --sub:#94a3b8; --dim:#64748b;
    --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font-family:"Malgun Gothic","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
       line-height:1.75;font-size:15px}
  header{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.96);
         border-bottom:1px solid var(--bd);backdrop-filter:blur(6px)}
  .hwrap{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:900;font-size:20px;letter-spacing:.5px}
  .logo b:nth-child(1){color:var(--blue)} .logo b:nth-child(2){color:var(--amber)} .logo b:nth-child(3){color:var(--green)}
  .htitle{font-size:13px;color:var(--sub)}
  .langs{margin-left:auto;display:flex;gap:6px}
  .langs button{background:#1e293b;color:var(--dim);border:1px solid #334155;border-radius:7px;
                padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .langs button.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
  main{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
  .hero{background:linear-gradient(135deg,#12233f,#0d1a2e);border:1px solid #1e3a5f;
        border-radius:14px;padding:22px 24px;margin-bottom:26px}
  .hero h1{margin:0 0 8px;font-size:26px}
  .hero p{margin:0;color:var(--sub);font-size:14px}
  nav.toc{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:30px}
  nav.toc div.tt{font-size:12px;color:var(--dim);font-weight:700;margin-bottom:8px}
  nav.toc ol{margin:0;padding-left:20px;columns:2;column-gap:26px}
  nav.toc li{margin:3px 0}
  nav.toc a{color:#93c5fd;text-decoration:none;font-size:14px}
  nav.toc a:hover{text-decoration:underline}
  section{margin-bottom:38px;scroll-margin-top:70px}
  h2{font-size:21px;margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid #1e3a5f}
  .lead{color:var(--sub);font-size:14px;margin:6px 0 16px}
  p{margin:10px 0}
  ol.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
  ol.steps>li{counter-increment:s;position:relative;padding:10px 0 10px 44px;border-bottom:1px dashed #1e293b}
  ol.steps>li:last-child{border-bottom:none}
  ol.steps>li::before{content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;
    background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px}
  .shot{margin:16px 0;background:var(--panel2);border:1px solid var(--bd);border-radius:12px;padding:10px;overflow:hidden}
  .shot img{width:100%;display:block;border-radius:8px;border:1px solid #223049}
  .shot .cap{font-size:12.5px;color:var(--dim);margin-top:8px;text-align:center}
  .shot .ph{height:170px;display:flex;align-items:center;justify-content:center;border:1px dashed #334155;
            border-radius:8px;color:#475569;font-size:13px;background:#0a1120}
  .tip,.warn,.note{border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14px}
  .tip{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.35)}
  .warn{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.38)}
  .note{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.32)}
  .tip b{color:#4ade80} .warn b{color:#fca5a5} .note b{color:#93c5fd}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
  th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#16233a;color:#93c5fd;font-weight:700;white-space:nowrap}
  code,kbd{background:#1e293b;border:1px solid #334155;border-radius:5px;padding:1px 6px;
           font-family:Consolas,"Courier New",monospace;font-size:13px;color:#7dd3fc}
  .k{color:var(--amber);font-weight:700}
  footer{max-width:1080px;margin:0 auto;padding:20px;color:#475569;font-size:12px;border-top:1px solid var(--bd)}
  @media print{
    header{position:static} .langs{display:none}
    body{background:#fff;color:#111} section{page-break-inside:avoid}
    .shot{background:#f8fafc;border-color:#cbd5e1} h2{border-color:#94a3b8}
  }
  @media (max-width:720px){ nav.toc ol{columns:1} .hwrap{padding:8px 12px} main{padding:16px 12px 60px} }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <span class="logo"><b>P</b><b>I</b><b>E</b></span>
    <span class="htitle" id="htitle"></span>
    <span class="langs">
      <button data-l="ko" class="on">🇰🇷 한국어</button>
      <button data-l="zh">🇨🇳 中文</button>
      <button data-l="vi">🇻🇳 Tiếng Việt</button>
    </span>
  </div>
</header>
<main>
  <div class="hero"><h1 id="h1"></h1><p id="hsub"></p></div>
  <nav class="toc"><div class="tt" id="tocT"></div><ol id="toc"></ol></nav>
  <div id="body"></div>
</main>
<footer id="foot"></footer>

function esc(s){return String(s);}
function block(b,L){
  if(b.t==='p')    return '<p>'+esc(b.x)+'</p>';
  if(b.t==='h3')   return '<h3 style="margin:18px 0 4px;font-size:16px;color:#93c5fd">'+esc(b.x)+'</h3>';
  if(b.t==='tip')  return '<div class="tip">💡 '+esc(b.x)+'</div>';
  if(b.t==='warn') return '<div class="warn">⚠ '+esc(b.x)+'</div>';
  if(b.t==='note') return '<div class="note">ℹ '+esc(b.x)+'</div>';
  if(b.t==='steps')return '<ol class="steps">'+b.x.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol>';
  if(b.t==='tab')  return '<table><thead><tr>'+b.head.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')
                          +'</tr></thead><tbody>'+b.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')
                          +'</tbody></table>';
  if(b.t==='shot'){
    var img=SHOTS[b.k]
      ? '<img src="'+SHOTS[b.k]+'" alt="'+esc(b.cap)+'">'
      : '<div class="ph">'+esc(L.phShot)+'</div>';
    return '<div class="shot">'+img+'<div class="cap">'+esc(b.cap)+'</div></div>';
  }
  return '';
}
function render(l){
  var L=G[l];
  document.documentElement.lang = l==='ko'?'ko':l==='zh'?'zh-CN':'vi';
  document.getElementById('htitle').textContent=L.htitle;
  document.getElementById('h1').textContent=L.h1;
  document.getElementById('hsub').textContent=L.hsub;
  document.getElementById('tocT').textContent=L.tocT;
  document.getElementById('foot').textContent=L.foot;
  document.getElementById('toc').innerHTML=L.sec.map(function(s){
    return '<li><a href="#'+s.id+'">'+s.icon+' '+esc(s.title)+'</a></li>';}).join('');
  document.getElementById('body').innerHTML=L.sec.map(function(s){
    return '<section id="'+s.id+'"><h2>'+s.icon+' '+esc(s.title)+'</h2>'
      +(s.lead?'<div class="lead">'+esc(s.lead)+'</div>':'')
      +s.b.map(function(b){return block(b,L);}).join('')+'</section>';}).join('');
  [].forEach.call(document.querySelectorAll('.langs button'),function(btn){
    btn.classList.toggle('on',btn.dataset.l===l);});
  try{localStorage.setItem('pie_guide_lang',l);}catch(e){}
}
[].forEach.call(document.querySelectorAll('.langs button'),function(btn){
  btn.addEventListener('click',function(){render(btn.dataset.l);});
});
var saved='ko'; try{saved=localStorage.getItem('pie_guide_lang')||'ko';}catch(e){}
render(G[saved]?saved:'ko');
</script>
